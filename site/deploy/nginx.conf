# Host nginx reverse proxy for the Sarapis site (container listens on 127.0.0.1:3000).
# Place in /etc/nginx/sites-available/sarapis.org, symlink into sites-enabled, then
# run certbot (see DEPLOY.md) to populate the TLS cert paths below.

# HTTP — redirect everything to HTTPS (certbot also edits this block)
server {
    listen 80;
    listen [::]:80;
    server_name sarapis.org www.sarapis.org;
    return 301 https://sarapis.org$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sarapis.org www.sarapis.org;

    ssl_certificate     /etc/letsencrypt/live/sarapis.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sarapis.org/privkey.pem;

    # Redirect www -> apex
    if ($host = www.sarapis.org) { return 301 https://sarapis.org$request_uri; }

    # Allow reasonably large media uploads through the admin
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
