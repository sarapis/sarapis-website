services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://sarapis.org}
    image: sarapis-site:latest
    restart: unless-stopped
    # Bind to localhost only — the host's nginx terminates TLS and proxies to this.
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env.production
    volumes:
      - sarapis_data:/app/data # SQLite database
      - sarapis_media:/app/media # uploaded media
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  sarapis_data:
  sarapis_media:
